name: Discord Rules Apply

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: discord-rules-apply-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # GitHub does NOT allow using secrets.* directly in if: conditionals,
      # so we gate via a step output instead.
      - name: Check whether Discord secrets exist
        id: gate
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD: ${{ secrets.DISCORD_GUILD }}
          DISCORD_GUILD_RULES_CHANNEL: ${{ secrets.DISCORD_GUILD_RULES_CHANNEL }}
        run: |
          if [ -n "$DISCORD_BOT_TOKEN" ] && [ -n "$DISCORD_GUILD" ] && [ -n "$DISCORD_GUILD_RULES_CHANNEL" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "Discord secrets detected. Running apply."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Discord secrets are missing. Skipping apply."
          fi

      - name: Install deps
        if: steps.gate.outputs.has_secrets == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .bot/requirements.txt

      - name: Run bot apply
        if: steps.gate.outputs.has_secrets == 'true'
        env:
          BOT_MODE: apply
          DISCORD_MENTIONS: "no"
          BOT_MESSAGE_DELAY: "1"

          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD: ${{ secrets.DISCORD_GUILD }}
          DISCORD_GUILD_RULES_CHANNEL: ${{ secrets.DISCORD_GUILD_RULES_CHANNEL }}
        run: python .bot/bot.py
