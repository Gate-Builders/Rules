name: Discord Rules Auto-merge

on:
  workflow_run:
    workflows: ["Discord Rules Validate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  automerge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Merge PR(s) for this workflow run
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const run = context.payload.workflow_run;
            const headSha = run.head_sha;

            core.info(`workflow_run id=${run.id} head_sha=${headSha}`);

            // Find PR numbers
            let prNumbers = (run.pull_requests || []).map(p => p.number);

            // Fallback: lookup PRs associated with the head SHA (more reliable)
            if (prNumbers.length === 0) {
              core.info("No PRs on workflow_run payload; looking up PRs associated with commit SHA...");
              const resp = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: headSha,
              });
              prNumbers = (resp.data || []).map(p => p.number);
            }

            if (prNumbers.length === 0) {
              core.info("No pull requests associated with this workflow run/commit. Nothing to merge.");
              core.setOutput("merged_any", "false");
              return;
            }

            prNumbers = [...new Set(prNumbers)];

            let mergedAny = false;

            for (const prNumber of prNumbers) {
              core.info(`Considering PR #${prNumber}`);

              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

              if (pr.base.ref !== "master") { core.info(`Skipping PR #${prNumber}: base is ${pr.base.ref}`); continue; }
              if (pr.state !== "open")      { core.info(`Skipping PR #${prNumber}: state is ${pr.state}`); continue; }
              if (pr.draft)                 { core.info(`Skipping PR #${prNumber}: draft`); continue; }

              // Only merge the exact commit SHA that passed validation (avoid races).
              if (pr.head.sha !== headSha) {
                core.info(`Skipping PR #${prNumber}: head moved to ${pr.head.sha}, validated ${headSha}`);
                continue;
              }

              // Gate on repo permission for the PR author: admin / maintain / write.
              const username = pr.user?.login;
              if (!username) {
                core.info(`Skipping PR #${prNumber}: missing PR author login`);
                continue;
              }

              let permData;
              try {
                permData = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username,
                });
              } catch (e) {
                // Most commonly: 404 if the user is not a collaborator / has no access.
                core.info(`Skipping PR #${prNumber}: cannot read permission for ${username} (${e.status || "unknown"} ${e.message})`);
                continue;
              }

              const permission = (permData.data.permission || "none").toLowerCase();  // admin | write | read | none
              const roleName   = (permData.data.role_name  || "").toLowerCase();     // admin | maintain | write | triage | read | custom (when present)

              // maintain maps to write in the legacy 'permission' field, so accept either signal.
              const allowedRoles = new Set(["admin", "maintain", "write"]);
              const isAllowed =
                allowedRoles.has(roleName) ||
                permission === "admin" ||
                permission === "write";

              if (!isAllowed) {
                core.info(`Skipping PR #${prNumber}: author ${username} permission=${permission} role_name=${roleName || "(none)"} (need admin/maintain/write)`);
                continue;
              }

              const maxAttempts = 12;

              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                const { data: refreshed } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

                if (refreshed.mergeable === null) {
                  core.info(`PR #${prNumber}: mergeability pending (attempt ${attempt}/${maxAttempts}); waiting 3s...`);
                  await new Promise(r => setTimeout(r, 3000));
                  continue;
                }

                if (refreshed.mergeable === false) {
                  core.warning(`PR #${prNumber}: not mergeable (mergeable_state=${refreshed.mergeable_state}).`);
                  break;
                }

                const methods = ["squash", "merge", "rebase"];
                let merged = false;

                for (const method of methods) {
                  try {
                    await github.rest.pulls.merge({
                      owner,
                      repo,
                      pull_number: prNumber,
                      merge_method: method,
                    });
                    core.info(`Merged PR #${prNumber} using method: ${method}`);
                    merged = true;
                    mergedAny = true;
                    break;
                  } catch (e) {
                    core.warning(`Merge with '${method}' failed for PR #${prNumber}: ${e.message}`);
                  }
                }

                if (!merged) {
                  core.warning(`PR #${prNumber}: eligible but could not merge.`);
                }

                break;
              }
            }

            core.setOutput("merged_any", mergedAny ? "true" : "false");

      - name: Dispatch Apply workflow on master
        if: steps.merge.outputs.merged_any == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "discord-rules-apply.yml",
              ref: "master",
            });
            core.info("Dispatched Discord Rules Apply workflow (ref=master).");
